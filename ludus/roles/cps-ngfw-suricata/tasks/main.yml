---
# cps-ngfw-suricata: Install and configure Suricata on NGFW router
# Two instances: S1 (eth0.30 L3↔L2) and S2 (eth0.10 L2↔L1)

# Suricata was removed from Debian bookworm main; it lives in bookworm-backports.
- name: Enable bookworm-backports repository
  apt_repository:
    repo: "deb http://deb.debian.org/debian bookworm-backports main"
    filename: bookworm-backports
    state: present
    update_cache: true

- name: Install Suricata and dependencies (from backports)
  apt:
    name:
      - suricata
      - suricata-update
      - jq
    state: present
    default_release: bookworm-backports
    update_cache: true

# The backports package does not always create the suricata group/user; make sure they exist
# before any task references `group: suricata`.
- name: Ensure suricata system group exists
  group:
    name: suricata
    system: true

- name: Ensure suricata system user exists
  user:
    name: suricata
    group: suricata
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create management user for remote rule push
  user:
    name: "{{ suricata_mgmt_user }}"
    shell: /bin/bash
    groups: suricata
    create_home: true

- name: Deploy console SSH public key for management user
  authorized_key:
    user: "{{ suricata_mgmt_user }}"
    key: "{{ lookup('file', 'cps_console_ed25519.pub') }}"
    state: present

- name: Allow suricata-mgmt to reload rules without password
  copy:
    dest: /etc/sudoers.d/suricata-mgmt
    content: |
      {{ suricata_mgmt_user }} ALL=(root) NOPASSWD: /usr/bin/suricatasc -c reload-rules *
      {{ suricata_mgmt_user }} ALL=(root) NOPASSWD: /usr/bin/suricatasc -c ruleset-reload-rules *
      {{ suricata_mgmt_user }} ALL=(root) NOPASSWD: /bin/systemctl restart suricata-*
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Create log directories for each probe
  file:
    path: "{{ item.log_dir }}"
    state: directory
    owner: suricata
    group: suricata
    mode: '0755'
  loop: "{{ suricata_interfaces }}"

# Suricata runs as root and writes fast.log as root:root 0644 — but it is
# re-created on each restart, so a one-shot chmod is not enough. Give the
# console SSH user (suricata-mgmt) a recursive ACL *and* a default ACL so every
# future fast.log is readable; without this the /ws/logs tail -f fails silently
# and no alert ever reaches the monitor UI.
- name: Install acl (for Suricata log read access)
  apt:
    name: acl
    state: present

- name: Grant {{ suricata_mgmt_user }} read access to Suricata logs (recursive + default ACL)
  ansible.builtin.shell: |
    setfacl -R  -m u:{{ suricata_mgmt_user }}:rX /var/log/suricata
    setfacl -R -d -m u:{{ suricata_mgmt_user }}:rX /var/log/suricata
  changed_when: true
  # First line = ACL on existing files/dirs; second = default ACL so every
  # future fast.log inherits read access (Suricata re-creates it as root:root
  # on each restart). Without this, the /ws/logs tail -f fails silently.

# The Ludus router firewall has an INPUT rule rejecting SSH from the whole lab
# (ip saddr 10.x.0.0/16 tcp dport 22 reject), so the management console cannot
# SSH the NGFW to push rules / reload / tail logs. Allow the mgmt VLAN (where
# the console lives) to reach the router's own :22, inserted BEFORE that reject.
- name: Determine mgmt subnet (VLAN 99) allowed to SSH the NGFW
  ansible.builtin.set_fact:
    console_ssh_source: >-
      {{ (ansible_all_ipv4_addresses | select('match', '^10\\..*\\.99\\.') | first | default('10.1.99.254')).split('.')[0:3] | join('.') }}.0/24

- name: Deploy helper that allows the console to SSH the NGFW (idempotent)
  ansible.builtin.copy:
    dest: /usr/local/sbin/ngfw-allow-console-ssh.sh
    mode: '0755'
    content: |
      #!/bin/sh
      # Insert an ACCEPT for mgmt->router:22 before the lab-wide SSH reject.
      SRC="$1"
      iptables -C INPUT -s "$SRC" -p tcp --dport 22 -j ACCEPT 2>/dev/null \
        || iptables -I INPUT -s "$SRC" -p tcp --dport 22 -j ACCEPT

- name: Deploy systemd unit to persist the console SSH allowance across reboots
  ansible.builtin.copy:
    dest: /etc/systemd/system/ngfw-console-ssh.service
    content: |
      [Unit]
      Description=Allow the mgmt console to SSH the NGFW (insert before lab reject)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/ngfw-allow-console-ssh.sh {{ console_ssh_source }}

      [Install]
      WantedBy=multi-user.target

- name: Enable and (re)start the console SSH allowance now
  ansible.builtin.systemd:
    name: ngfw-console-ssh.service
    enabled: true
    state: restarted
    daemon_reload: true

- name: Create custom rules directory (writable by the mgmt user)
  file:
    path: "{{ suricata_rules_dir }}"
    state: directory
    owner: "{{ suricata_mgmt_user }}"
    group: suricata
    mode: '0775'

- name: Initialize an empty custom rules file per probe
  copy:
    dest: "{{ suricata_rules_dir }}/custom_{{ item.name }}.rules"
    content: "# Custom Suricata rules for probe {{ item.name }} — pushed from the management console\n"
    owner: "{{ suricata_mgmt_user }}"
    group: suricata
    mode: '0664'
    force: false
  loop: "{{ suricata_interfaces }}"

# Self-heal: if the files were edited as root (tee from the console would then
# fail with Permission denied), force ownership/mode back without touching
# content (force:false above keeps pushed rules intact).
- name: Ensure custom rules files stay writable by the console user
  file:
    path: "{{ suricata_rules_dir }}/custom_{{ item.name }}.rules"
    owner: "{{ suricata_mgmt_user }}"
    group: suricata
    mode: '0664'
    state: file
  loop: "{{ suricata_interfaces }}"

- name: Deploy Suricata config for each probe instance
  template:
    src: suricata-instance.yaml.j2
    dest: "/etc/suricata/suricata-{{ item.name }}.yaml"
    owner: root
    group: suricata
    mode: '0640'
  loop: "{{ suricata_interfaces }}"
  notify: restart suricata instances

- name: Deploy systemd unit for each Suricata instance
  template:
    src: suricata-instance.service.j2
    dest: "/etc/systemd/system/suricata-{{ item.name }}.service"
  loop: "{{ suricata_interfaces }}"
  notify:
    - reload systemd
    - restart suricata instances

- name: Enable and start Suricata instances
  systemd:
    name: "suricata-{{ item.name }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ suricata_interfaces }}"

- name: Run suricata-update for ET Open + ICS rules
  command: suricata-update --suricata-conf /etc/suricata/suricata-{{ suricata_interfaces[0].name }}.yaml
  args:
    creates: /var/lib/suricata/rules/suricata.rules
  changed_when: false

- name: Deploy rule reload helper script
  template:
    src: reload-rules.sh.j2
    dest: /usr/local/bin/suricata-reload-rules
    mode: '0755'

# Optional IPS mode via NFQUEUE
- name: Configure NFQUEUE for IPS mode
  iptables:
    chain: FORWARD
    jump: NFQUEUE
    queue_num: "{{ idx }}"
    in_interface: "{{ item.iface }}"
    comment: "Suricata IPS {{ item.name }}"
  loop: "{{ suricata_interfaces }}"
  loop_control:
    index_var: idx
  when: suricata_enable_ips | bool
