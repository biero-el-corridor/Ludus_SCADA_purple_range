---
# cps-postgres-vuln: PostgreSQL with pg_execute_server_program (vulnerable)
# Fix: the community.postgresql.* modules with become_user: postgres fail
# (MODULE FAILURE) because Ansible connects as root and the unprivileged
# postgres user cannot reach /root/.ansible/tmp. We instead run the DB setup
# as root via `sudo -u postgres psql`, which avoids Ansible's unprivileged
# become machinery entirely.

- name: Install PostgreSQL
  apt:
    name:
      - "postgresql-{{ pg_version }}"
      - "postgresql-client-{{ pg_version }}"
      - python3-psycopg2
    state: present
    update_cache: true

- name: Configure PostgreSQL to listen on all interfaces
  lineinfile:
    path: "/etc/postgresql/{{ pg_version }}/main/postgresql.conf"
    regexp: "^#?listen_addresses"
    line: "listen_addresses = '{{ pg_listen_address }}'"
  notify: restart postgresql

- name: Allow connections from all VLANs (insecure — workshop only)
  lineinfile:
    path: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"
    line: "host all all 10.0.0.0/8 md5"
  notify: restart postgresql

- name: Ensure PostgreSQL is running
  systemd:
    name: postgresql
    state: started
    enabled: true

- name: Apply config now
  meta: flush_handlers

- name: Create vulnerable database
  become: true
  ansible.builtin.shell: >
    sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ pg_database }}'" | grep -q 1
    || sudo -u postgres createdb "{{ pg_database }}"
  changed_when: false

- name: Create application user with SUPERUSER (vulnerable)
  become: true
  ansible.builtin.shell: >
    sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ pg_vuln_user }}'" | grep -q 1
    || sudo -u postgres psql -c "CREATE ROLE \"{{ pg_vuln_user }}\" LOGIN SUPERUSER PASSWORD '{{ pg_vuln_password }}';"
  changed_when: false

- name: Create and seed SCADA logs table
  become: true
  ansible.builtin.shell: |
    sudo -u postgres psql -d "{{ pg_database }}" <<'SQL'
    CREATE TABLE IF NOT EXISTS process_data (
      id SERIAL PRIMARY KEY,
      timestamp TIMESTAMPTZ DEFAULT NOW(),
      tag_name VARCHAR(64),
      value FLOAT,
      quality VARCHAR(16) DEFAULT 'GOOD'
    );
    INSERT INTO process_data (tag_name, value)
    SELECT 'Temperature_L1', 22.0 + random() * 5
    FROM generate_series(1, 100)
    WHERE NOT EXISTS (SELECT 1 FROM process_data);
    SQL
  changed_when: false
