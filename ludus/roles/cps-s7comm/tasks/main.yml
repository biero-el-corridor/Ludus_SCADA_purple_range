---
# cps-s7comm: Mock S7comm server on PLC (port 102 via snap7)
# Simulates a Siemens S7-300 CPU
# NOTE: python-snap7 1.x ships manylinux wheels that bundle the libsnap7
#       C library, so no system 'libsnap7-1' package is needed (it does not
#       exist in the Debian repos anyway). Running under systemd as root lets
#       the server bind the privileged ISO-TSAP port 102.
#       Pinned < 2.0: the mock server uses the 1.x API (snap7.types.srvAreaDB);
#       python-snap7 2.0 renamed the module to snap7.type and breaks it.

- name: Install S7comm server dependencies
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: true

- name: Create S7comm server directory
  file:
    path: /opt/s7comm-server
    state: directory

- name: Create Python venv
  command: python3 -m venv /opt/s7comm-server/venv
  args:
    creates: /opt/s7comm-server/venv/bin/activate

- name: Install snap7 Python bindings (bundles libsnap7)
  pip:
    name: "python-snap7>=1.3,<2.0"
    virtualenv: /opt/s7comm-server/venv

- name: Deploy S7comm mock server
  template:
    src: s7_server.py.j2
    dest: /opt/s7comm-server/server.py
    mode: '0755'

- name: Deploy systemd unit
  copy:
    dest: /etc/systemd/system/s7comm-server.service
    content: |
      [Unit]
      Description=Mock S7comm Server — PLC (Snap7)
      After=network-online.target
      [Service]
      Type=simple
      ExecStart=/opt/s7comm-server/venv/bin/python3 /opt/s7comm-server/server.py
      Restart=on-failure
      RestartSec=5
      [Install]
      WantedBy=multi-user.target

- name: Enable and start S7comm server
  systemd:
    name: s7comm-server
    enabled: true
    state: started
    daemon_reload: true
